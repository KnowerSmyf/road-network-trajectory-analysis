[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "road-trajectory-analysis"
version = "0.1.0"
description = "Network-aware analysis of Porto taxi trajectories using PostGIS and pgRouting"
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy>=2.0,<3.0",
    "osmnx",
    "geopandas",
    "shapely",
    "pyogrio",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
pythonpath = ["src", "."]